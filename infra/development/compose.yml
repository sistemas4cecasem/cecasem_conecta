# Independiente del Compose principal. Exclusivamente desarrollo/pruebas locales.
name: cecasem_conecta_development

services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Configure DEV_POSTGRES_PASSWORD}
      POSTGRES_DB: cecasem_conecta_development
    ports:
      - '127.0.0.1:${DEV_POSTGRES_PORT:-55432}:5432'
    volumes:
      - development_postgres_data:/var/lib/postgresql
      - ./init-test.sql:/docker-entrypoint-initdb.d/10-init-test.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d cecasem_conecta_development']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  development_postgres_data:
