name: cecasem_conecta

services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: ${DB_NAME:?Configure DB_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Configure DB_ADMIN_PASSWORD}
      POSTGRES_APP_USER: ${DB_USER:?Configure DB_USER}
      POSTGRES_APP_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init-app.sql:/docker-entrypoint-initdb.d/10-init-app.sql:ro
    # TablePlus connects with localhost; only the local host can reach this port.
    ports:
      - target: 5432
        published: ${DB_PORT:-5432}
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - data
      - tableplus

  api:
    image: ${COMPOSE_PROJECT_NAME:-cecasem_conecta}-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      APP_PORT: ${APP_PORT:-3000}
      FIRST_ACCESS_TOKEN_TTL_SECONDS: ${FIRST_ACCESS_TOKEN_TTL_SECONDS:-86400}
      PASSWORD_RESET_TOKEN_TTL_SECONDS: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:-14400}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?Set SESSION_COOKIE_SECURE explicitly for HTTP or HTTPS}
      FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT:-/app/storage/private}
      TRANSLATION_ENABLED: ${TRANSLATION_ENABLED:-false}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      TRANSLATION_TIMEOUT_MS: ${TRANSLATION_TIMEOUT_MS:-10000}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-20971520}
      DATABASE_URL: postgresql://${DB_USER:?Configure DB_USER}:${DB_PASSWORD:?Configure DB_PASSWORD}@db:5432/${DB_NAME:?Configure DB_NAME}
    volumes:
      - private_files:${FILE_STORAGE_ROOT:-/app/storage/private}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:" + process.env.APP_PORT + "/api/v1/health", {signal: AbortSignal.timeout(4000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true
    restart: unless-stopped
    networks:
      - edge
      - data

  web:
    image: ${COMPOSE_PROJECT_NAME:-cecasem_conecta}-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    environment:
      API_PORT: ${APP_PORT:-3000}
    ports:
      - target: 80
        published: ${WEB_PORT:-3000}
        protocol: tcp
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - edge

volumes:
  postgres_data:
  private_files:

networks:
  edge:
  tableplus:
    name: ${COMPOSE_PROJECT_NAME:-cecasem_conecta}_tableplus
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  data:
    internal: true
